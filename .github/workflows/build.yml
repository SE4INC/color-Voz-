name: Build Cris Vox Color VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -S COLOR-VOZ -DCMAKE_BUILD_TYPE=Release -DCRIS_BUILD_TESTS=OFF

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRIS-VOX-COLOR-VST3
          path: build/**/VST3
